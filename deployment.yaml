apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agri-deployment
  labels:
    app: smart-agri
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: smart-agri
  template:
    metadata:
      labels:
        app: smart-agri
    spec:
      containers:
      - name: smart-agri-container
        image: 78619/smart-agri:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agri-service
spec:
  type: NodePort
  selector:
    app: smart-agri
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000
